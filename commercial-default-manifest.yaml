profiles:
  commercial_general_sft:
    stage: sft
    description: 商用默认通用／多语言／数学／精确指令 SFT；不包含 NC 或 review_required 数据
    mixture:
    - dataset: tulu3_sft_mixture
      weight: 0.65
    - dataset: aya_dataset
      weight: 0.1
    - dataset: openmath_reasoning
      weight: 0.15
    - dataset: tulu3_persona_if
      weight: 0.1
    overrides:
      max_seq_len: 8192
      packing: false
      assistant_only_loss: true
      row_token_budget: 250000000
  commercial_code_sft:
    stage: sft
    description: 商用默认代码专项；通用回放与代码主集分开计量
    mixture:
    - dataset: tulu3_sft_mixture
      weight: 0.2
    - dataset: opencodeinstruct
      weight: 0.8
    overrides:
      max_seq_len: 8192
      packing: false
      assistant_only_loss: true
      row_token_budget: 250000000
  commercial_long_sft:
    stage: sft
    description: 商用默认长文引用专项；长输入单独验收
    mixture:
    - dataset: tulu3_sft_mixture
      weight: 0.6
    - dataset: longcite_45k
      weight: 0.4
    overrides:
      max_seq_len: 32768
      packing: false
      assistant_only_loss: true
      row_token_budget: 200000000
  commercial_preference_dpo:
    stage: preference
    description: 最佳商用 SFT 之后的偏好实验；固定 preference config
    mixture:
    - dataset: helpsteer3_preference
      weight: 1.0
    overrides:
      max_prompt_len: 4096
      max_response_len: 4096
  commercial_math_rlvr:
    stage: rlvr
    description: 商用默认数学 RLVR；Math-Verify 版本和奖励一致性签署后启动
    mixture:
    - dataset: dapo_math_17k
      weight: 1.0
    overrides:
      max_prompt_len: 4096
      max_response_len: 8192
      rollouts_per_prompt: 8
      temperature: 0.7
      curriculum: base_model_pass_rate_buckets
preflight:
  require_immutable_revisions: true
  require_data_quality_signoff: true
  require_license_signoff: true
  require_decontamination_signoff: true
  require_verifier_signoff_for_rlvr: true
  fail_on_disabled_dataset: true
  fail_on_unaccepted_gated_dataset: true
  require_no_call_negative_for_tool_profile: true
signoff:
  data_quality: false
  license: false
  decontamination: false
  verifier: false
isolation:
  recipe_class: commercial
  allow_cross_recipe_raw_cache_or_output_reuse: false
  research_to_commercial_promotion: requires_new_manifest_and_full_license_review
  eval_only_assets_allowed_in_mixture: false
run_record:
  run_id: REPLACE_ME
  resolved_manifest_sha256: REPLACE_ME
  benchmark_versions: REPLACE_ME
  decontamination_report: REPLACE_ME
  data_quality_report: REPLACE_ME
  license_review_report: REPLACE_ME
  verifier_test_report: REPLACE_ME
  notes: 记录实际样本数、row tokens、supervised tokens、长度分桶、删除原因和最终权重
