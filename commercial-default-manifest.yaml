manifest_version: '1.0'
metadata:
  name: commercial-post-training-recipe
  created_at: '2026-11-09'
  source_resolved_at: '2026-11-10T01:37:56Z'
  canonical_catalog: datasets-list.yaml
  weight_semantics: 归一化采样权重；不是样本行数占比，也不是有效 token 占比
  token_budget_semantics: row_tokens_before_loss_mask；supervised_tokens 单独记录
  status: executable_schema_pending_real_signoffs_not_training_authorization
project:
  selected_profile: commercial_general_sft
  commercial_use: true
  seed: 42
  output_dir: ./runs/commercial-default
  base_model:
    id: baidu/ERNIE-5.5-Flash-Base-BF16
    revision: dfab899dadcff8f4d08af24b75a26c6d4d2e0b09
    chat_template: ernie55_chat_template.jinja
    chat_template_bridge_revision: 08035723e7a86f94fc54a7f4473bd0519f2ac941
    max_seq_len: 8192
    add_special_tokens: true
paths:
  raw_root: ./commercial_default/raw
  processed_root: ./commercial_default/processed
  cache_root: ./commercial_default/cache
runtime:
  num_proc: 8
  trust_remote_code: false
  overwrite_processed: false
defaults:
  sft:
    output_format: messages
    assistant_only_loss: true
    mask_tool_outputs: true
    packing: false
    truncation: drop
    max_seq_len: 8192
  preference:
    output_format: prompt_chosen_rejected
    max_prompt_len: 4096
    max_response_len: 4096
  rlvr:
    output_format: prompt_answer_verifier
    max_prompt_len: 4096
    max_response_len: 8192
    rollouts_per_prompt: 8
    temperature: 0.7
    correct_reward: 1.0
    incorrect_reward: 0.0
datasets:
  tulu3_sft_mixture:
    canonical_id: tulu3_sft_mixture
    stage: sft
    enabled: true
    source:
      provider: huggingface
      repo_id: allenai/tulu-3-sft-mixture
      revision: b14afda60f1bbebe55d5d2fa1e4df5042f97f8be
      subset: default
      split: train
      local_path: null
    data:
      format: messages
      adapter: messages_passthrough
      fields:
        messages: messages
    license:
      id: ODC-By-1.0
      commercial_status: allowed_with_obligations
      attribution_required: true
      upstream_review_required: true
      teacher_terms_review_required: true
      notes: revision 固定不等于许可签署；商用前须完成上游和教师条款审查
    access:
      gated: false
      terms_accepted: false
    processing:
      max_samples: null
      dedup:
      - exact
      - minhash
      - semantic_or_parent_problem
      decontaminate: true
      filters:
      - valid_roles
      - nonempty_assistant
      - length_histogram
      - upstream_provenance_audit
  aya_dataset:
