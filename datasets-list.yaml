excluded_or_deferred_candidates:
- name: PRISM Alignment
  status: deferred
  reason: 本次官方数据卡访问返回 401，未核验当前字段、许可和规模，不写成已核验推荐项
- name: Skywork-SynPref-40M
  status: deferred
  reason: 论文可核实 40M 池与 26M 精选子集，但当前官方 HF API/README 返回 401，固定数据包与许可未核验
- name: Qwen AutoIF
  status: deferred
  reason: 官方数据卡本次返回 401；已有 Tulu Persona IF、IFEval-like filtered 与 VerInstruct，不凭二手清单晋升
- name: WebDancer / WebSailor
  status: deferred
  reason: 当前未形成可核验的固定训练数据卡与许可；WebLINX 仅补非商用静态轨迹，动态环境仍须专项建设
- name: Mind2Web train
  status: deferred
  reason: 官方声明研究用途且测试包单独分发；本版只将 1,341 测试任务列 eval_only，训练侧先用 WebLINX 研究轨迹
- name: SWE-bench-extra
  status: deferred
  reason: 本次原始数据卡访问返回 401；已有 SWE-Gym/SWE-smith/R2E-Gym，不为凑数纳入未核验项
- name: LongAttn / LongABC
  status: out_of_scope
  reason: 官方项目为长上下文继续预训练数据，不属于本 post-training 清单；不得当作长输出 SFT
- name: τ-bench legacy
  status: superseded
  reason: 旧任务已过时；本版使用 sierra-research/tau2-bench 的 τ-bench 2.0.0 text-v1，且不与 1.x 分数直接比较
- name: Audio-FLAN
  status: deferred
  reason: 论文召回超 1 亿实例、80 任务且含音频生成；需先固定官方理解子集、许可和生成／理解边界，不整包纳入
- name: AudioBench/MMAU direct HF cards
  status: partially_verified
  reason: 官方项目与论文已核验，但当前猜测的 HF repo 返回 401；不登记未经核实的 HF revision 或统一行数
- name: OCRBench/MMStar/BLINK/MLVU direct HF cards
  status: partially_verified
  reason: 当前直接 HF API 返回 401；已保留官方项目入口和 eval_only 定义，未编造 SHA 或许可
- name: CMMMU/CMMU direct HF cards
  status: partially_verified
  reason: 官方 GitHub 与论文规模已核验，直接 HF API 401；固定发布包后再补 revision
- name: GUI-R1 / Video-R1 / VideoChat-R1
  status: deferred
  reason: 代码和奖励流程可召回，但本版未核验统一固定数据包；不把方法仓库当同质数据集
- name: LLaVA 558K / LLaVA-OneVision-1.5-Mid-Training-85M
  status: out_of_scope
  reason: 分别是特征对齐预训练和 mid-training，不属于本后训练清单
- name: text-to-image / speech, music and video generation
  status: out_of_scope
  reason: 本库覆盖后训练理解、指令、对齐与 Agent，不扩展到媒体生成数据
- name: medical imaging / remote sensing
  status: out_of_scope
  reason: 保留为专门领域审查范围；OneVision/FineVision 内相关 config 默认不选
global_preflight:
- 固定 repo revision、文件哈希和实际 split
- 按精确/近重复/语义/母题/仓库/网站/媒体内容谱系去重去污
- 许可、上游媒体、肖像／声音同意、教师服务条款和访问条件分别签署
- 按有效 token、独立提示、媒体时长、任务和轨迹分别配比
- 数学/代码/工具/坐标/时空/音频验证器实际重跑
- 固定图像尺寸、视频抽帧、音频采样率、codec 和 processor
- eval_only 和私有时间外评测绝不进入训练
