schema_version: '1.0'
metadata:
  name: base-and-multimodal-post-training-datasets-list
  created_at: '2026-11-09'
  canonical: true
  supersedes: 不覆盖训练 manifest；本文件是资产总表
scope:
  modalities:
  - text
  - image
  - video
  - audio
  base_model_target: text-only Base LLM and multimodal Base models with compatible processors
  recipe_boundary: commercial-default 与 research-isolated 仍为 ERNIE 文本专用；多模态资产不得自动进入这两套配方
  completeness_definition: 文本、图像、视频、音频的核心能力，SFT/偏好/RLVR/PRM/Agent 阶段、许可治理、独立评测和本地必需物料覆盖完整；不是穷尽所有公开数据集
  excluded:
  - 媒体生成、raw caption、特征对齐预训练和 mid-training
  - 未形成可固定版本或无法确认用途的候选
  - 医学影像和遥感等需专门审查的领域
usage_tier_definitions:
  core: 首轮配方候选；仍需完成版本、质量、去污和许可签署，不等于已批准商用
  optional: 按目标和消融结果加入的补集
  research_only: 非商用许可或仅适合研究的小数据／特定假设数据
  eval_only: 独立评测；train_prohibited=true，严禁训练
  local_required: 必须由业务方建设，公共数据不能替代
provenance:
  previous_report: llm-post-training-datasets-zh.md
  previous_asset_ids:
  - dolci_instruct_sft
  - nemotron_cascade_2_sft
  - tulu3_sft_mixture
  - smoltalk2
  - no_robots
  - oasst2
  - lima
  - wildchat
  - coig_pc_lite
  - coig_cqia
  - belle
  - firefly
  - openthoughts3
  - numina_math_cot
  - openmath_reasoning
  - s1k
  - limo
  - kodcode
  - acecode_87k
  - magicoder
  - xlam_function_calling
  - toolace
  - glaive_function_calling_v2
