name: Update post-training dataset catalog

on:
  workflow_dispatch:
  schedule:
    # 每天 17:17 UTC（北京时间次日 01:17），避开整点与半点。
    - cron: '17 17 * * *'

permissions:
  contents: write

concurrency:
  group: datasets-catalog-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install 'PyYAML>=6.0,<7'
      - name: Test updater
        run: python -m unittest scripts/test_update_datasets_catalog.py -v
      - name: Refresh metadata and discover candidates
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/update_datasets_catalog.py --discover
      - name: Validate curated catalogue
        run: python validate_datasets_list.py datasets-list.yaml --expect-total 175
      - name: Validate recipe references and isolation
        run: python validate_training_recipes.py
      - name: Check repository documentation and links
        run: python scripts/check_repository.py
      - name: Commit changed generated files
        run: |
          if git diff --quiet -- data/dataset-catalog-state.json datasets-candidates.yaml datasets-catalog.md datasets-update-report.md; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dataset-catalog-state.json datasets-candidates.yaml datasets-catalog.md datasets-update-report.md
          git commit -m 'chore(data): refresh dataset catalog'
          git push
