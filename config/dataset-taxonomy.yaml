schema_version: '1.0'
name: base-and-multimodal-post-training-dataset-taxonomy
scope: text/image/video/audio Base model post-training understanding, alignment and agents

automation:
  min_score: 6.0
  require_strong: true
  discovery_limit_per_query: 20
  history_keep: 30
  request_timeout_seconds: 20
  request_pause_seconds: 0.10
  max_retries: 3
  weights:
    strong: {title: 6.0, body: 3.0}
    medium: {title: 3.0, body: 1.5}
    weak: {title: 1.0, body: 0.5}

# 只排除明确范围外任务；multimodal、vision-language、video understanding 不再误杀。
# 自动召回只进入 pending_review，媒体生成和专门领域不会自动晋升。
negative:
  - image generation
  - text-to-image
  - video generation
  - text-to-video
  - music generation
  - sound generation
  - speech synthesis
  - text-to-speech
  - medical imaging
  - remote sensing
  - recommender system

blocklist: []

queries:
  - {category: general_sft, search: instruction sft}
  - {category: general_sft, search: supervised fine tuning chat}
  - {category: chinese, search: chinese instruction}
  - {category: multilingual, search: multilingual instruction}
  - {category: instruction_following, search: verifiable instruction following}
  - {category: long_context, search: long context sft}
  - {category: reasoning, search: reasoning traces}
  - {category: math, search: math reasoning}
  - {category: rlvr_math, search: math rlvr}
  - {category: code, search: code reasoning}
  - {category: rlvr_code, search: code rlvr}
  - {category: tool, search: function calling}
  - {category: agent_search, search: search agent reinforcement learning}
  - {category: agent_swe, search: swe agent}
  - {category: preference, search: human preference}
  - {category: process_reward, search: process reward}
  - {category: safety, search: llm safety refusal}
  - {category: evaluation, search: llm benchmark evaluation}
  - {category: rlvr_if, search: instruction following rlvr}
  - {category: long_output, search: long output instruction following}
  - {category: agent_browser, search: browser web navigation agent dataset}
  - {category: agent_safety, search: agent prompt injection safety benchmark}
  - {category: vision_sft, search: visual instruction tuning dataset}
  - {category: document_sft, search: document chart ocr instruction dataset}
  - {category: multiimage_sft, search: multi image instruction tuning}
  - {category: video_sft, search: video instruction tuning dataset}
  - {category: multimodal_preference, search: vision language preference reward model}
  - {category: multimodal_reasoning, search: multimodal reasoning instruction dataset}
  - {category: multimodal_rlvr, search: visual rlvr verifiable reward}
  - {category: gui_agent, search: gui agent action trajectory dataset}
  - {category: audio_sft, search: audio speech instruction tuning dataset}
  - {category: multimodal_safety, search: vision language safety preference dataset}
  - {category: multimodal_evaluation, search: multimodal understanding benchmark evaluation}
  - {category: audio_evaluation, search: audio understanding reasoning benchmark}
  - {category: multilingual_multimodal, search: chinese multimodal instruction dataset}

categories:
  general_sft:
    name: 通用指令与 SFT
    keywords:
      strong: [instruction following, supervised fine-tuning, supervised fine tuning, sft dataset, instruction dataset]
      medium: [instruction, chat, alignment, conversation]
      weak: [llm, language model]
  chinese:
    name: 中文指令与领域数据
    keywords:
      strong: [chinese instruction, chinese sft, chinese conversation, 中文指令]
      medium: [chinese, zh-cn, mandarin, 中文]
      weak: [instruction, chat]
  multilingual:
    name: 多语言指令数据
    keywords:
      strong: [multilingual instruction, multilingual sft, cross-lingual instruction]
      medium: [multilingual, cross-lingual, translation]
      weak: [language, instruction]
  instruction_following:
    name: 精确指令遵循
    keywords:
      strong: [verifiable instruction, instruction following constraints, ifeval, constraint following]
      medium: [instruction following, constraints, verifiable]
      weak: [sft, alignment]
  long_context:
    name: 长上下文与引用
    keywords:
      strong: [long context sft, long-context instruction, long document citation, grounded citation]
      medium: [long context, long-document, citation, long align]
      weak: [instruction, reasoning]
  reasoning:
    name: 通用与蒸馏推理
    keywords:
      strong: [reasoning traces, reasoning dataset, chain-of-thought, chain of thought]
      medium: [reasoning, cot, deliberative]
      weak: [sft, distillation]
  math:
    name: 数学 SFT
    keywords:
      strong: [math reasoning, mathematics reasoning, math cot, mathematical chain-of-thought]
      medium: [math, mathematics, gsm8k, solution]
      weak: [reasoning, sft]
  rlvr_math:
    name: 数学 RLVR
    keywords:
      strong: [math rlvr, mathematical rlvr, verifiable math rewards, math reinforcement learning]
      medium: [rlvr, reinforcement learning, math, verifiable reward]
      weak: [reasoning, grpo]
  code:
