schema_version: '1.0'
metadata:
  name: multimodal-post-training-datasets-extension
  created_at: '2026-11-09'
  canonical_subset: true
scope:
  modalities:
  - text
  - image
  - video
  - audio
  included:
  - multimodal instruction/SFT
  - preference/reward model
  - RLVR
  - GUI Agent
  - independent evaluation
  excluded:
  - media generation
  - raw caption pretraining
  - feature-alignment pretraining
  - mid-training
datasets:
- id: llava_instruct_150k
  name: LLaVA-Instruct-150K
  category: vision_sft
  stages:
  - sft
  usage_tier: research_only
  modalities:
  - text
  - image
  scale:
    value: 157710
    unit: instruction_samples
    note: 当前 FineVision 同名子集也为 157,710；不得与 558K 特征对齐集混写
  source:
    provider: huggingface
    repo_id: liuhaotian/LLaVA-Instruct-150K
    url: https://huggingface.co/datasets/liuhaotian/LLaVA-Instruct-150K
    split: train
    revision_policy: pin_immutable_revision_before_use
    observed_revision: 9d451dc7629cfe0469f6ae4432b765cd603d5fcb
  data_format: image_conversations
  capabilities:
  - visual_instruction
  - multilingual_multimodal
  license:
    id: CC-BY-4.0 + GPT-4/upstream-terms
    commercial_status: noncommercial
    upstream_and_teacher_terms_review_required: true
  access: public
  risks:
  - GPT-4 输出与原始图像上游条款
  - LLaVA 项目研究／非商用约束
  recommendation:
  - 仅作研究视觉指令基线；与 FineVision、LLaVA-1.5、Mantis 按来源去重
  train_prohibited: false
  eval_isolation_required: false
  relations: []
  verification:
    status: official_checked
    checked_at: '2026-11-09'
- id: llava15_mix665k
  name: LLaVA-1.5 Mix665K
  category: vision_sft
