    observed_revision: 0efb7ad47f8ba36e1d262545cadec4cd8960dc5f
  data_format: image_conversations_by_source
  capabilities:
  - visual_instruction
  - visual_grounding
  - visual_counting
  - document_chart_ocr
  - visual_reasoning_rlvr
  - multilingual_multimodal
  license:
    id: Apache-2.0 + mixed-upstream
    commercial_status: review_required
    upstream_and_teacher_terms_review_required: true
  access: public
  risks:
  - 多上游许可和 GPT 教师输出
