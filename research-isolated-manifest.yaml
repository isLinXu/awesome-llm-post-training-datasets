profiles:
  research_reasoning_sft:
    stage: sft
    description: 研究隔离推理、多语言、中文蒸馏与长输出 SFT；包含 NC／待审数据
    mixture:
    - dataset: openmath_reasoning
      weight: 0.3
    - dataset: opencode_reasoning
      weight: 0.25
    - dataset: chinese_r1_distill_110k
      weight: 0.15
    - dataset: m2lingual
      weight: 0.1
    - dataset: longform
      weight: 0.1
    - dataset: tulu3_sft_mixture
      weight: 0.1
    overrides:
      max_seq_len: 16384
      packing: false
      assistant_only_loss: true
      row_token_budget: 250000000
  research_browser_sft:
    stage: sft
    description: WebLINX 1.0 chat 静态轨迹研究；不得视为动态浏览环境训练
    mixture:
    - dataset: weblinx
      weight: 0.8
    - dataset: tulu3_sft_mixture
      weight: 0.2
    overrides:
      max_seq_len: 16384
      packing: false
      assistant_only_loss: true
      mask_tool_outputs: true
      row_token_budget: 200000000
  research_overrefusal_sft:
    stage: sft
    description: FalseReject Instruct 防过拒研究；test 独立隔离，不使用 CoT 字段复制样本
    mixture:
    - dataset: falsereject_train
      weight: 0.6
    - dataset: tulu3_sft_mixture
      weight: 0.4
    overrides:
      max_seq_len: 8192
      packing: false
      assistant_only_loss: true
      row_token_budget: 200000000
  research_preference_dpo:
    stage: preference
    description: Tulu 3 整包偏好研究基线；含非商小子集，禁止晋升商用
    mixture:
    - dataset: tulu3_preference_mixture
      weight: 1.0
    overrides:
      max_prompt_len: 4096
      max_response_len: 4096
  research_enigmata_rlvr:
    stage: rlvr
    description: Enigmata 非商用规则验证 RL；固定全部任务验证器和 Eval 实例去污后启动
    mixture:
    - dataset: enigmata_data
      weight: 1.0
    overrides:
      max_prompt_len: 16384
      max_response_len: 4096
      rollouts_per_prompt: 8
      temperature: 0.7
      curriculum: task_and_pass_rate_buckets
preflight:
  require_immutable_revisions: true
  require_data_quality_signoff: true
  require_license_signoff: true
  require_decontamination_signoff: true
  require_verifier_signoff_for_rlvr: true
  fail_on_disabled_dataset: true
  fail_on_unaccepted_gated_dataset: true
  require_no_call_negative_for_tool_profile: true
signoff:
  data_quality: false
  license: false
  decontamination: false
  verifier: false
isolation:
  recipe_class: research
  allow_cross_recipe_raw_cache_or_output_reuse: false
  research_to_commercial_promotion: requires_new_manifest_and_full_license_review
  eval_only_assets_allowed_in_mixture: false
run_record:
  run_id: REPLACE_ME
  resolved_manifest_sha256: REPLACE_ME
  benchmark_versions: REPLACE_ME
  decontamination_report: REPLACE_ME
  data_quality_report: REPLACE_ME
  license_review_report: REPLACE_ME
  verifier_test_report: REPLACE_ME
  notes: 记录实际样本数、row tokens、supervised tokens、长度分桶、删除原因和最终权重
