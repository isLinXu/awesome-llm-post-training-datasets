manifest_version: '1.0'
metadata:
  name: research-post-training-recipe
  created_at: '2026-11-09'
  source_resolved_at: '2026-11-09T06:01:42Z'
  canonical_catalog: datasets-list.yaml
  weight_semantics: 归一化采样权重；不是样本行数占比，也不是有效 token 占比
  token_budget_semantics: row_tokens_before_loss_mask；supervised_tokens 单独记录
  status: executable_schema_pending_real_signoffs_not_training_authorization
project:
  selected_profile: research_reasoning_sft
  commercial_use: false
  seed: 42
  output_dir: ./runs/research-isolated
  base_model:
    id: baidu/ERNIE-5.5-Flash-Base-BF16
    revision: dfab899dadcff8f4d08af24b75a26c6d4d2e0b09
    chat_template: ernie55_chat_template.jinja
    chat_template_bridge_revision: 08035723e7a86f94fc54a7f4473bd0519f2ac941
    max_seq_len: 8192
    add_special_tokens: true
paths:
  raw_root: ./research_isolated/raw
  processed_root: ./research_isolated/processed
  cache_root: ./research_isolated/cache
runtime:
  num_proc: 8
  trust_remote_code: false
  overwrite_processed: false
defaults:
  sft:
    output_format: messages
    assistant_only_loss: true
    mask_tool_outputs: true
    packing: false
    truncation: drop
    max_seq_len: 8192
  preference:
    output_format: prompt_chosen_rejected
    max_prompt_len: 4096
    max_response_len: 4096
  rlvr:
    output_format: prompt_answer_verifier
    max_prompt_len: 4096
    max_response_len: 8192
    rollouts_per_prompt: 8
    temperature: 0.7
    correct_reward: 1.0
    incorrect_reward: 0.0
